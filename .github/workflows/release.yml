name: Release

# Runs when a GitHub Release is published (e.g. v1.1.0). Publishes:
#  - the runnable jar, attached to that release
#  - a Docker image at ghcr.io/jonatakuzi/recruit-guard
on:
  release:
    types: [published]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GitHub Container Registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Attach the jar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: target/recruit-guard-*.jar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Check recruiter emails for job-scam red flags
            org.opencontainers.image.licenses=MIT
